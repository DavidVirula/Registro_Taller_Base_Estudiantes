<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro al taller de Desarrollo Web</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <p class="etiqueta">Universidad · Actividad de clase</p>
      <h1>Registro al taller</h1>
      <p>Completa tus datos para reservar un espacio.</p>
    </header>

    <section class="panel" aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Datos de inscripción</h2>
      <form id="formulario-registro">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" required minlength="2" maxlength="120" autocomplete="name">

        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" required maxlength="160" autocomplete="email">

        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="tel" required maxlength="30" autocomplete="tel">

        <label for="taller">Taller</label>
        <select id="taller" name="taller" required>
          <option value="">Selecciona un taller</option>
          <option value="HTML y CSS">HTML y CSS</option>
          <option value="JavaScript">JavaScript</option>
          <option value="Node.js y Express">Node.js y Express</option>
        </select>

        <label for="horario">Horario</label>
        <select id="horario" name="horario" required>
          <option value="">Selecciona un horario</option>
          <option value="07:00 - 09:00">07:00 - 09:00</option>
          <option value="09:00 - 11:00">09:00 - 11:00</option>
          <option value="11:00 - 13:00">11:00 - 13:00</option>
        </select>

        <label for="modalidad">Modalidad</label>
        <select id="modalidad" name="modalidad" required>
          <option value="">Selecciona una modalidad</option>
          <option value="Presencial">Presencial</option>
          <option value="Virtual">Virtual</option>
        </select>

        <label for="nivel_experiencia">Nivel de experiencia</label>
        <select id="nivel_experiencia" name="nivel_experiencia" required>
          <option value="">Selecciona tu nivel</option>
          <option value="Principiante">Principiante</option>
          <option value="Intermedio">Intermedio</option>
          <option value="Avanzado">Avanzado</option>
        </select>

        <div class="acciones-formulario">
          <button id="boton-guardar" type="submit">Registrar inscripción</button>
          <button id="boton-cancelar" class="secundario oculto" type="button">Cancelar edición</button>
        </div>
      </form>
      <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="titulo-lista">
      <div class="titulo-seccion">
        <h2 id="titulo-lista">Participantes inscritos</h2>
        <span id="contador" class="contador">0 registros</span>
      </div>
      <ul id="lista-inscripciones" aria-live="polite">
        <li class="vacio">Aún no hay inscripciones.</li>
      </ul>
    </section>

    <section class="panel" aria-labelledby="titulo-reportes">
      <h2 id="titulo-reportes">Resumen de inscripciones</h2>
      <div class="total-reporte">
        <span>Total de participantes</span>
        <strong id="total-inscripciones">0</strong>
      </div>
      <div class="reportes-grid">
        <div><h3>Por taller</h3><ul id="reporte-taller" class="lista-reporte"></ul></div>
        <div><h3>Por horario</h3><ul id="reporte-horario" class="lista-reporte"></ul></div>
        <div><h3>Por modalidad</h3><ul id="reporte-modalidad" class="lista-reporte"></ul></div>
      </div>
    </section>
  </main>
</body>
</html>
